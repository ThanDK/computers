spring.application.name=computers

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# AWS S3 configuration
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=ap-southeast-2
aws.s3.bucketname=computers-pro

# JWT configuration
jwt.secret.key=${JWT_SECRET_KEY}

# Paypal configuration
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=sandbox

app.frontend.url=${APP_FRONTEND_URL}
paypal.payment.successUrl=${APP_BACKEND_URL}/api/orders/capture/%s
paypal.payment.cancelUrl=${app.frontend.url}/payment-cancelled

# App settings
app.currency=THB
app.tax-rate=0.07


management.endpoints.web.exposure.include=*

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile