services:

  # Backend API Service
  computers-api:
    build:
      context: ./computers
      dockerfile: Dockerfile
    container_name: computers-api-container
    ports:
      - "8080:8080"
    # This correctly provides all .env variables to the backend at RUNTIME
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - computers-network

  # Admin Frontend Service
  admin-panel-frontend:
    build:
      context: ./AdminPanelX
      dockerfile: Dockerfile

      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    container_name: admin-panel-container
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - computers-network

  # User Frontend Service
  user-frontend:
    build:
      context: ./User-ui
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    container_name: user-frontend-container
    ports:
      - "5174:80"
    restart: unless-stopped
    networks:
      - computers-network
      
  # The MongoDB database service
  mongo:
    image: mongo:latest
    container_name: mongo-db-container
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - computers-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

# The shared network for all services to communicate
networks:
  computers-network:
    driver: bridge

# The persistent data volume for MongoDB
volumes:
  mongo-data:
    driver: local